<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zecolis Mobile Onboarding - Écran 2 (Voyageur Plein Écran)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#0B2A5B',
              darkNavy: '#1D1D4B',
              deepNight: '#040d1a',
              orange: '#FF6B00',
              orangeHover: '#EA580C',
              success: '#22A55A',
              cardBg: 'rgba(255, 255, 255, 0.12)',
              pillBg: 'rgba(255, 255, 255, 0.88)'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .text-glow {
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
    }
    .chip-glow {
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16), 0 1px 2px rgba(255, 255, 255, 0.4) inset;
    }
    .cta-glow {
      box-shadow: 0 8px 24px -4px rgba(11, 42, 91, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
    }
  </style>
</head>
<body class="m-0 p-0 h-full w-full bg-[#020617] text-white flex items-center justify-center font-sans antialiased overflow-hidden">

  <!-- Mobile Frame Container 390x844 -->
  <main class="relative w-full max-w-[390px] h-[844px] max-h-screen overflow-hidden shadow-2xl bg-[#040d1a] flex flex-col justify-between select-none">

    <!-- 1. Background Hero Photography (Full Bleed Edge-to-Edge) -->
    <div class="absolute inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
      <img 
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBS6YWfxKMFOAjQG2PpM6OuwH578Ql9cIXLvjBm_-TcBV6qxHuQDgFKqIVSm_I-EA5zB889yDbdtSIbA5CRIDNcYxqDg7TsIqIgXrPFAxSRKVvvjvBBH18gh0982qF2M_CcT-ri7kWKaPTwAnUFak2O_yBgaRH2MninrZR-bX4foBNqjtPx5fqOzqNKqDVduo4JJ4JOS5mS6F4eFFigM4Ky-Mf_L_uSY7V3L4nUr7bS6aNshyGZbBTg2Q" 
        alt="Voyageur Zecolis à l'aéroport international de Cotonou avec sa valise, colis transporté et paiement mobile confirmé sur smartphone" 
        class="w-full h-full object-cover object-[center_top]"
      />

      <!-- Multi-layered Atmospheric Gradient for absolute typography legibility while keeping the traveler, smartphone & parcel crystal clear -->
      <!-- Soft ambient top gradient for status bar and header pills -->
      <div class="absolute inset-x-0 top-0 h-36 bg-gradient-to-b from-[#030914]/80 via-[#030914]/30 to-transparent"></div>

      <!-- Left-weighted subtle gradient across mid-section for typography negative space -->
      <div class="absolute inset-0 bg-gradient-to-r from-[#030914]/85 via-[#030914]/40 to-transparent"></div>

      <!-- Lower third deep navy gradient for headline, supporting sentence, and CTA -->
      <div class="absolute inset-x-0 bottom-0 h-[460px] bg-gradient-to-t from-[#020712] via-[#040f24]/90 to-transparent"></div>
    </div>

    <!-- 2. Header Layer (Z-Index 20) -->
    <header class="relative z-20 pt-3 px-5 flex flex-col gap-2.5">
      
      <!-- Native Mobile Status Bar Row (discreet iOS style) -->
      <div class="flex items-center justify-between text-white/90 text-xs font-semibold tracking-tight px-1 py-1">
        <span>9:41</span>
        <div class="flex items-center gap-1.5 opacity-90">
          <!-- Cellular Signal -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.5-.47 2.89-1.28 4.03L12 19.34l-5.72-3.31C5.47 14.89 5 13.5 5 12c0-3.87 3.13-7 7-7z" opacity="0"/></svg>
          <div class="flex items-end gap-0.5 h-2.5">
            <span class="w-0.5 h-1 bg-white rounded-full"></span>
            <span class="w-0.5 h-1.5 bg-white rounded-full"></span>
            <span class="w-0.5 h-2 bg-white rounded-full"></span>
            <span class="w-0.5 h-2.5 bg-white rounded-full"></span>
          </div>
          <!-- Wifi -->
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.3c3.78 0 7.21 1.48 9.77 3.91L12 18.66 2.23 11.21C4.79 8.78 8.22 7.3 12 7.3z"/></svg>
          <!-- Battery -->
          <div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
            <div class="w-full h-full bg-white rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- Top Nav Bar: Official Brand Pill + Skip Link -->
      <div class="flex items-center justify-between mt-1">
        <!-- Logo Translucent White Rounded Container -->
        <div class="chip-glow backdrop-blur-md bg-white/90 border border-white/40 rounded-full px-3 py-1.5 flex items-center gap-2 shadow-sm transition active:scale-95">
          <!-- Official Zecolis Isometric Parcel Vector Logo -->
          <svg class="w-5 h-5 drop-shadow-sm" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4L34 12V28L20 36L6 28V12L20 4Z" fill="#0B2A5B" fill-opacity="0.08"/>
            <path d="M20 5L33 12.5L20 20L7 12.5L20 5Z" fill="#22A55A"/>
            <path d="M20 20L33 12.5V27.5L20 35V20Z" fill="#FF6B00"/>
            <path d="M7 12.5L20 20V35L7 27.5V12.5Z" fill="#0B2A5B"/>
            <circle cx="20" cy="20" r="2.5" fill="#FFFFFF"/>
          </svg>
          <span class="text-xs font-black tracking-widest text-[#0B2A5B]">ZECOLIS</span>
        </div>

        <!-- Passer / Skip Button -->
        <button type="button" aria-label="Passer l'onboarding" class="chip-glow backdrop-blur-md bg-white/90 hover:bg-white text-[#0B2A5B] font-semibold text-xs py-1.5 px-3.5 rounded-full flex items-center gap-1 border border-white/50 transition active:scale-95 shadow-sm">
          <span>Passer</span>
          <svg class="w-3.5 h-3.5 text-[#0B2A5B]/80" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- Minimal 3-Step Progress Indicator (Step 2 Active) -->
      <div class="w-full flex items-center gap-1.5 mt-2 px-0.5">
        <!-- Step 1 Completed -->
        <div class="h-1 flex-1 rounded-full bg-[#FF6B00] shadow-[0_0_8px_rgba(255,107,0,0.5)]"></div>
        <!-- Step 2 Active (Highlighted & Pulsing slightly) -->
        <div class="h-1 flex-1 rounded-full bg-[#FF6B00] shadow-[0_0_10px_rgba(255,107,0,0.75)]"></div>
        <!-- Step 3 Inactive -->
        <div class="h-1 flex-1 rounded-full bg-white/20"></div>
      </div>
    </header>

    <!-- 3. Mid Floating Contextual Layer (Route & Native Product Chips) -->
    <div class="relative z-10 px-5 mt-3 flex flex-col items-start gap-2.5 pointer-events-none">
      
      <!-- Small Elegant Route Indicator: Cotonou ↔ Paris -->
      <div class="pointer-events-auto backdrop-blur-md bg-[#0B2A5B]/75 border border-white/20 rounded-full px-3 py-1 shadow-lg flex items-center gap-2 text-xs font-medium tracking-tight text-white">
        <span class="flex items-center gap-1">
          <span class="text-[11px]">🇧🇯</span>
          <span class="font-semibold text-[11px] text-white/95">Cotonou</span>
        </span>
        <!-- Thin Bidirectional Arrow in Brand Orange -->
        <svg class="w-3.5 h-3.5 text-[#FF6B00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        <span class="flex items-center gap-1">
          <span class="font-semibold text-[11px] text-white/95">Paris</span>
          <span class="text-[11px]">🇫🇷</span>
        </span>
      </div>

      <!-- Floating Product Component #1: Paiement reçu ✓ with Success Green accent -->
      <div class="pointer-events-auto chip-glow backdrop-blur-md bg-white/95 border border-white/80 rounded-full py-1.5 px-3.5 flex items-center gap-2 shadow-md">
        <div class="w-4 h-4 rounded-full bg-[#22A55A] flex items-center justify-center text-white">
          <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <span class="text-xs font-bold text-[#0B2A5B] tracking-tight">Paiement reçu</span>
        <span class="text-[10px] font-extrabold text-[#22A55A] bg-[#22A55A]/10 px-1.5 py-0.5 rounded-md">✓ Instantané</span>
      </div>

      <!-- Floating Product Component #2: 8 kg disponibles with small suitcase icon -->
      <div class="pointer-events-auto chip-glow backdrop-blur-md bg-white/95 border border-white/80 rounded-full py-1.5 px-3 flex items-center gap-2 shadow-md">
        <svg class="w-3.5 h-3.5 text-[#FF6B00]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7h-4V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 5h4v2h-4V5zm10 14H4V9h16v10z"/>
        </svg>
        <span class="text-xs font-bold text-[#0B2A5B] tracking-tight">8 kg disponibles</span>
      </div>

    </div>

    <!-- 4. Lower Typography & Bottom Actions Section -->
    <div class="relative z-20 px-6 pb-6 pt-2 flex flex-col justify-end">
      
      <!-- Text Hierarchy directly over darker lower section -->
      <div class="mb-5 flex flex-col items-start">
        
        <!-- Eyebrow: VOYAGEUR with small orange pulse indicator -->
        <div class="flex items-center gap-2 mb-2">
          <span class="w-2 h-2 rounded-full bg-[#FF6B00] shadow-[0_0_8px_#FF6B00] animate-pulse"></span>
          <span class="text-[11px] font-extrabold tracking-[0.2em] text-[#FF6B00] uppercase">VOYAGEUR</span>
        </div>

        <!-- Main Headline (Inter, ~40px, font-black 800-900, tight tracking) -->
        <h1 class="text-[38px] leading-[1.08] font-black tracking-[-0.035em] text-white text-glow mb-2.5">
          Voyagez.<br>
          <span class="text-[#FF6B00] drop-shadow-[0_2px_12px_rgba(255,107,0,0.4)]">Gagnez.</span>
        </h1>

        <!-- One Short Supporting Sentence -->
        <p class="text-[14px] leading-snug font-medium text-white/90 max-w-[290px] drop-shadow-sm">
          Votre trajet peut aussi vous rapporter.
        </p>

        <!-- Subtle trust proof signature -->
        <div class="flex items-center gap-2 mt-2.5 text-[11px] font-medium text-white/60 tracking-wide">
          <span>Kilos rentabilisés</span>
          <span class="text-white/30">•</span>
          <span>Colis vérifié</span>
          <span class="text-white/30">•</span>
          <span class="text-[#22A55A] font-semibold">Paiement garanti</span>
        </div>
      </div>

      <!-- Bottom Primary CTA Button: Suivant → (#0B2A5B, 56px height, rounded 16px) -->
      <div class="w-full flex flex-col items-center gap-3">
        <button 
          type="button" 
          aria-label="Écran suivant" 
          class="cta-glow w-full h-14 bg-gradient-to-r from-[#0B2A5B] to-[#123975] hover:from-[#0d326d] hover:to-[#17468f] text-white font-bold text-[16px] rounded-2xl flex items-center justify-center gap-2.5 border border-white/20 transition-all duration-200 active:scale-[0.98] cursor-pointer"
        >
          <span>Suivant</span>
          <svg class="w-5 h-5 text-white/90 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>

        <!-- Pagination: ○ ● ○ (Second dot active) -->
        <div class="flex items-center justify-center gap-2 pt-1 pb-1">
          <!-- Step 1 -->
          <span class="w-2 h-2 rounded-full bg-white/30 transition-all"></span>
          <!-- Step 2 Active: expanded pill in brand orange -->
          <span class="w-6 h-2 rounded-full bg-[#FF6B00] shadow-[0_0_8px_rgba(255,107,0,0.6)] transition-all"></span>
          <!-- Step 3 -->
          <span class="w-2 h-2 rounded-full bg-white/30 transition-all"></span>
        </div>

        <!-- iOS Home Indicator bar -->
        <div class="w-32 h-1 bg-white/25 rounded-full mt-0.5"></div>
      </div>

    </div>

  </main>

</body>
</html>
