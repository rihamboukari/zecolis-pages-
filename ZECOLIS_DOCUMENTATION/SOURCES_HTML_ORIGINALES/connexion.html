<!DOCTYPE html><html class="h-full" lang="fr" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Zecolis Mobile - Connexion</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Inter font -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            zecolis: {
              navy: '#0B2A5B',
              darknavy: '#1D1D4B',
              orange: '#FF6B00',
              green: '#22A55A',
              bg: '#F8FAFC',
              text: '#0F172A',
              muted: '#64748B',
              border: '#F1F5F9',
              lightborder: '#E2E8F0',
            }
          },
          boxShadow: {
            'btn-navy': '0 8px 20px -4px rgba(11, 42, 91, 0.25), 0 4px 10px -2px rgba(11, 42, 91, 0.15)',
            'input-subtle': '0 2px 6px 0 rgba(15, 23, 42, 0.03)',
            'pill-soft': '0 2px 8px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>
<style>
    /* Smooth transitions and touch enhancements */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      overscroll-behavior-y: none;
    }
    input:focus {
      outline: none;
    }
    .active-scale:active {
      transform: scale(0.98);
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body class="h-full w-full bg-[#F8FAFC] antialiased select-none flex flex-col justify-between">
<!-- Main Phone Viewport Container (Native 390x844 px feel) -->
<main class="w-full max-w-[390px] mx-auto min-h-full flex flex-col justify-between px-6 pt-6 pb-5">
<!-- Top Area: Status spacing & Header -->
<header class="w-full">
<!-- Status bar visual breathing space (approx 12px) -->
<div class="h-2 w-full"></div>
<!-- Top Header Navigation Bar -->
<div class="flex items-center justify-between py-2"><div class="flex items-center gap-2"><div class="flex items-center gap-1.5 px-3 py-1 bg-white rounded-full border border-slate-100 shadow-sm"><img alt="Zecolis" class="w-7 h-7 object-contain rounded-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKGvn-dD18T9yL2TYuowMrW63xATng1kDSqNWFd6I14iyrRw8jAPJ8de0eeCVnBmXYEAe1BwkD_DUbQr9ISECMF42Jx2XpyYdzNqnGbD4qgV0mrePMGm7ANsERxKHKC7PZ4ikXTWIwzcYcCBYyIZM8GDdAaQ6K_7NVcR580prK8NWvpOsDVxilCGJYjhxtL38eD9LooXe7JsZwO0HDS9y63k0q1MuTcWlPMzxeH8c4vQi54coFXRh2FOWW-nyXTQ7ngl8"><span class="font-extrabold text-[15px] tracking-tight text-zecolis-darknavy">Zé<span class="text-zecolis-orange">Colis</span></span></div><span class="text-[11px] font-medium text-zecolis-darknavy tracking-wide">Connexion</span></div><div class="flex items-center gap-1.5 px-2.5 py-1 bg-white rounded-full border border-slate-100 shadow-pill-soft"><i class="w-3.5 h-3.5 text-zecolis-green stroke-[2.2]" data-lucide="shield-check"></i><span class="text-[9.5px] font-bold tracking-wider text-zecolis-darknavy uppercase">Sécurisée</span></div></div>
</header>
<!-- Center Content: Title, Form and Actions -->
<div class="flex-1 flex flex-col py-4 pt-6">
<!-- Main Heading & Supporting text -->
<div class="mb-7">
<h1 class="text-[30px] leading-[1.2] font-extrabold text-zecolis-darknavy tracking-tight">
          Bon retour <span class="text-zecolis-orange">!</span>
</h1>
<p class="mt-2 text-[14px] leading-relaxed text-zecolis-muted font-normal">
          Connectez-vous pour continuer à envoyer<br>ou voyager.
        </p>
</div>
<!-- Form Container -->
<form class="space-y-4" id="loginForm" novalidate="" onsubmit="handleLoginSubmit(event)">
<!-- Field 1: Email -->
<div>
<label class="block text-[11px] font-semibold tracking-wider text-[#94A3B8] uppercase mb-1.5" for="emailInput">
            EMAIL
          </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#94A3B8] group-focus-within:text-zecolis-navy transition-colors">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="mail" aria-hidden="true" class="lucide lucide-mail w-5 h-5 stroke-[1.8]"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-white text-zecolis-text placeholder-[#CBD5E1] text-[15px] font-medium rounded-2xl border border-[#F1F5F9] shadow-input-subtle focus:border-zecolis-navy focus:ring-1 focus:ring-zecolis-navy transition-all duration-150" id="emailInput" name="email" placeholder="votre@email.com" required="" type="email">
</div>
<!-- Compact Validation Error State (hidden by default) -->
<div class="hidden mt-1.5 flex items-center gap-1.5 text-rose-500 text-[11.5px] font-medium pl-1" id="emailError">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-circle" aria-hidden="true" class="lucide lucide-alert-circle w-3.5 h-3.5 stroke-[2]"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></svg>
<span class="">Veuillez entrer une adresse e-mail valide.</span>
</div>
</div>
<!-- Field 2: Mot de passe + Oublié link -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="text-[11px] font-semibold tracking-wider text-[#94A3B8] uppercase" for="passwordInput">
              MOT DE PASSE
            </label>
<a class="text-[12px] font-semibold text-zecolis-orange hover:text-orange-600 transition-colors active-scale" href="javascript:void(0)">
              Oublié ?
            </a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#94A3B8] group-focus-within:text-zecolis-navy transition-colors">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="lock" aria-hidden="true" class="lucide lucide-lock w-5 h-5 stroke-[1.8]"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-white text-zecolis-text placeholder-[#CBD5E1] text-[15px] font-medium rounded-2xl border border-[#F1F5F9] shadow-input-subtle focus:border-zecolis-navy focus:ring-1 focus:ring-zecolis-navy tracking-widest focus:tracking-normal transition-all duration-150" id="passwordInput" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Afficher ou masquer le mot de passe" class="absolute inset-y-0 right-0 pr-4 flex items-center text-[#94A3B8] hover:text-zecolis-navy active-scale transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" aria-hidden="true" class="lucide lucide-eye w-5 h-5 stroke-[1.8]" id="eyeIcon"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<!-- Compact Error State (for general credentials, hidden by default) -->
<div class="hidden mt-1.5 flex items-center gap-1.5 text-rose-500 text-[11.5px] font-medium pl-1" id="generalError">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="alert-circle" aria-hidden="true" class="lucide lucide-alert-circle w-3.5 h-3.5 stroke-[2]"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></svg>
<span class="">Adresse e-mail ou mot de passe incorrect.</span>
</div>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full h-14 bg-zecolis-navy hover:bg-[#082046] active:bg-[#061836] text-white text-[16px] font-bold rounded-2xl shadow-btn-navy active-scale transition-all duration-150 flex items-center justify-center gap-2" id="loginSubmitBtn" type="submit">
<span id="btnText" class="">Se connecter</span>
<div class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white/30 border-t-white" id="btnSpinner"></div>
</button>
</div>
<!-- Registration Prompt -->
<div class="pt-2 text-center">
<p class="text-[13.5px] text-zecolis-muted">
            Pas encore de compte ?
            <a class="text-zecolis-orange font-bold hover:underline ml-1 inline-block active-scale" href="javascript:void(0)">
              S'inscrire
            </a>
</p>
</div>
</form>
</div>
<!-- Bottom Security & iOS indicator area -->
<footer class="w-full pb-1 pt-3 flex flex-col items-center">
<!-- Subtle Security reassurance -->
<div class="flex items-center gap-1.5 text-[11.5px] font-medium text-zecolis-muted">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="shield" aria-hidden="true" class="lucide lucide-shield w-3.5 h-3.5 text-zecolis-green stroke-[2.2]"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 1 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
<span class="">Vos informations restent sécurisées.</span>
</div>
<!-- iOS Native Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mt-4"></div>
</footer>
</main>
<script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdInput.classList.remove('tracking-widest');
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwdInput.type = 'password';
        pwdInput.classList.add('tracking-widest');
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Realistic form submission handling with feedback
    function handleLoginSubmit(event) {
      event.preventDefault();
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const emailError = document.getElementById('emailError');
      const generalError = document.getElementById('generalError');
      const btn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      // Reset errors
      emailError.classList.add('hidden');
      generalError.classList.add('hidden');

      // Simple email format check
      const emailVal = emailInput.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailVal || !emailPattern.test(emailVal)) {
        emailError.classList.remove('hidden');
        emailInput.focus();
        return;
      }

      if (!passwordInput.value) {
        passwordInput.focus();
        return;
      }

      // Enter Loading State
      btn.disabled = true;
      btnText.textContent = "Connexion…";
      btnSpinner.classList.remove('hidden');

      // Emulate auth feedback
      setTimeout(() => {
        btn.disabled = false;
        btnText.textContent = "Se connecter";
        btnSpinner.classList.add('hidden');
        
        // Show success visual touch
        btn.classList.remove('bg-zecolis-navy');
        btn.classList.add('bg-zecolis-green');
        btnText.textContent = "Connecté ✓";

        setTimeout(() => {
          btn.classList.remove('bg-zecolis-green');
          btn.classList.add('bg-zecolis-navy');
          btnText.textContent = "Se connecter";
        }, 1800);
      }, 900);
    }
  </script>




</body></html>
