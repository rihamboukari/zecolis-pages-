<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zecolis Mobile Onboarding - Écran 1 (Expéditeur)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            zecolis: {
              navy: '#0B2A5B',
              dark: '#071630',
              deep: '#040d1c',
              orange: '#FF6B00',
              orangeLight: '#FF8533',
              green: '#22A55A',
              lightBg: '#FCFBF8',
              cardBorder: 'rgba(255, 255, 255, 0.15)',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030914;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      user-select: none;
    }
    .text-tight {
      letter-spacing: -0.035em;
    }
    .text-wide {
      letter-spacing: 0.22em;
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 16px -2px rgba(7, 22, 48, 0.18);
    }
    .glass-pill-dark {
      background: rgba(7, 22, 48, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.35);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #0B2A5B 0%, #071D40 100%);
      box-shadow: 0 10px 24px -4px rgba(11, 42, 91, 0.45), 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .btn-gradient:active {
      transform: scale(0.985);
      opacity: 0.95;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 bg-slate-950">

  <!-- Mobile Container (390 x 844 px) -->
  <div class="relative w-full max-w-[390px] h-[844px] max-h-screen overflow-hidden sm:rounded-[44px] shadow-2xl bg-zecolis-deep flex flex-col justify-between">

    <!-- FULL SCREEN HERO PHOTOGRAPHY -->
    <div class="absolute inset-0 z-0">
      <img 
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxUs2sY7wYGG8_M5ktrhKognk27tEwbqeZtuzIIMEkymcpUAQ7O3eDFEPmu5YRzTKZiJOFjDxwiIJ32AbK3M74V7BzP80e_hnngEsQiP64o6TMzj43w1yuuPfcfrzzpwW0Z1nW9_whfXrsU7jrN7I6KgYsi4Jo1FFIKGYfe0gJ45DUrm-OoN70KSnHPHBV-vYHRulJXwcBGouOrGcDht_-cyPAQpdOTF_v3ah3wfsQetJbHaciLvGeyw" 
        alt="Rencontre authentique entre une expéditrice et un voyageur Zecolis à l'aéroport de Cotonou" 
        class="w-full h-full object-cover object-center"
      />

      <!-- Sophisticated Vignette & Navy Gradient Overlays -->
      <!-- Top soft vignette for status & header readability -->
      <div class="absolute inset-x-0 top-0 h-44 bg-gradient-to-b from-[#071630]/75 via-[#071630]/30 to-transparent"></div>

      <!-- Mid-to-bottom atmospheric gradient for perfect text contrast -->
      <div class="absolute inset-x-0 top-[38%] bottom-0 bg-gradient-to-b from-transparent via-[#051124]/75 to-[#040d1c] to-95%"></div>
    </div>

    <!-- LAYER 1: TOP CHROME (STATUS BAR, HEADER, PROGRESS) -->
    <div class="relative z-20 pt-3 px-5">
      
      <!-- iOS / Android simulated status bar -->
      <div class="flex items-center justify-between text-white/90 text-[13px] font-semibold tracking-tight py-1 px-1">
        <span>9:41</span>
        <div class="flex items-center space-x-2">
          <!-- Cellular signal -->
          <svg class="w-4 h-3 fill-current text-white/85" viewBox="0 0 17 12">
            <rect x="0" y="8" width="2.5" height="4" rx="0.5" />
            <rect x="4" y="6" width="2.5" height="6" rx="0.5" />
            <rect x="8" y="3.5" width="2.5" height="8.5" rx="0.5" />
            <rect x="12" y="0.5" width="2.5" height="11.5" rx="0.5" />
          </svg>
          <!-- Wifi -->
          <svg class="w-3.5 h-3 fill-current text-white/85" viewBox="0 0 16 12">
            <path d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.4L16 4.1C13.9 2 11.1 0.7 8 0.7C4.9 0.7 2.1 2 0 4.1L1.2 5.4C2.9 3.6 5.3 2.5 8 2.5ZM8 6.5C9.7 6.5 11.2 7.2 12.3 8.3L13.5 7.1C12.1 5.7 10.1 4.8 8 4.8C5.9 4.8 3.9 5.7 2.5 7.1L3.7 8.3C4.8 7.2 6.3 6.5 8 6.5ZM8 10.5C8.8 10.5 9.5 11.2 9.5 12C9.5 12.8 8.8 13.5 8 13.5C7.2 13.5 6.5 12.8 6.5 12C6.5 11.2 7.2 10.5 8 10.5Z"/>
          </svg>
          <!-- Battery -->
          <div class="w-5 h-2.5 rounded-[3px] border border-white/80 p-0.5 flex items-center">
            <div class="h-full w-3.5 bg-white/90 rounded-[1.5px]"></div>
          </div>
        </div>
      </div>

      <!-- MAIN APP HEADER -->
      <div class="flex items-center justify-between mt-2">
        <!-- Zecolis Brand Pill -->
        <div class="glass-pill rounded-full py-1.5 px-3 flex items-center space-x-2">
          <!-- Official Zecolis Logo SVG Geometry -->
          <div class="w-6 h-6 flex-shrink-0">
            <img src="https://lh3.googleusercontent.com/aida/AEtjO1UrM0b5pxWh3nPEjDeyYHLJwCLm7Aa-WYGiyDTo-6ycIH0JMIyEakHeFcV-J2gk8e92teu_XRTILphI9djqH9ybCwNeUqIt0R9OgKypBr1Sf4GVdOc17qqhvdebO8PHXXE-jLzpNynfgmxV_BIqmDLvTRGOreNVlew7E3ByNZUV8qEgocTrA1msJwRRNPsrE4Pv6o-zR3FZ-ZGUP8vh-kkGn1zn59R8WacqJ2jP9W22HPG6tvksLBQEI93f" alt="Zecolis Logo" class="w-full h-full object-contain" />
          </div>
          <span class="text-[10.5px] font-bold text-zecolis-navy tracking-[0.24em] uppercase">ZECOLIS</span>
        </div>

        <!-- Skip CTA button -->
        <button class="glass-pill rounded-full py-1.5 px-3.5 text-zecolis-navy text-[12.5px] font-semibold flex items-center space-x-1 hover:bg-white transition-colors duration-150">
          <span>Passer</span>
          <svg class="w-3.5 h-3.5 stroke-current stroke-[2.2] fill-none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>

      <!-- DISCREET ONBOARDING PROGRESS BAR (STEP 1 ACTIVE) -->
      <div class="mt-3.5 flex items-center space-x-1.5">
        <!-- Step 1: Active (Orange Gradient) -->
        <div class="h-[3px] flex-1 bg-gradient-to-r from-zecolis-orange to-zecolis-orangeLight rounded-full shadow-[0_0_8px_rgba(255,107,0,0.6)]"></div>
        <!-- Step 2: Inactive -->
        <div class="h-[3px] flex-1 bg-white/25 rounded-full"></div>
        <!-- Step 3: Inactive -->
        <div class="h-[3px] flex-1 bg-white/25 rounded-full"></div>
      </div>
    </div>

    <!-- LAYER 2: FLOATING NATIVE INTERFACE PILLS (INTEGRATED INTO STORYTELLING) -->
    <div class="relative z-10 px-5 mt-4 flex flex-col space-y-2.5">
      
      <!-- Route Pill: Cotonou <-> Paris with bidirectional arrow -->
      <div class="self-start glass-pill-dark rounded-full py-1.5 px-3.5 flex items-center space-x-2">
        <span class="text-xs">🇧🇯</span>
        <span class="text-[11.5px] font-semibold text-white/95 tracking-wide">Cotonou</span>
        
        <!-- Bidirectional horizontal arrow -->
        <div class="flex items-center text-zecolis-orange px-0.5">
          <svg class="w-3.5 h-3.5 stroke-current stroke-[2.2] fill-none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
          </svg>
        </div>

        <span class="text-[11.5px] font-semibold text-white/95 tracking-wide">Paris</span>
        <span class="text-xs">🇫🇷</span>
      </div>

      <!-- Two Product Verification Chips -->
      <div class="flex items-center space-x-2">
        <!-- Chip 1: Colis prêt -->
        <div class="glass-pill-dark rounded-full py-1.5 px-3 flex items-center space-x-1.5">
          <div class="w-3.5 h-3.5 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400">
            <svg class="w-2.5 h-2.5 stroke-current stroke-[2.5] fill-none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <span class="text-[11px] font-medium text-white/90">Colis prêt</span>
        </div>

        <!-- Chip 2: Voyage vérifié -->
        <div class="glass-pill-dark rounded-full py-1.5 px-3 flex items-center space-x-1.5">
          <div class="w-3.5 h-3.5 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400">
            <svg class="w-2.5 h-2.5 stroke-current stroke-[2.5] fill-none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <span class="text-[11px] font-medium text-white/90">Voyage vérifié</span>
        </div>
      </div>

    </div>

    <!-- SPACER TO PUSH TYPOGRAPHY & ACTIONS TO LOWER THIRD -->
    <div class="flex-1"></div>

    <!-- LAYER 3: LOWER THIRD OVERLAY (TYPOGRAPHY, SUPPORTING COPY, CTA & PAGINATION) -->
    <div class="relative z-20 px-6 pb-6 pt-2">

      <!-- Eyebrow Tag -->
      <div class="flex items-center space-x-2 mb-2">
        <span class="w-2 h-2 rounded-full bg-zecolis-orange animate-pulse"></span>
        <span class="text-[11px] font-bold text-zecolis-orange tracking-[0.22em] uppercase">
          ENVOYER UN COLIS
        </span>
      </div>

      <!-- Main Headline (40px, font-black, tight tracking) -->
      <h1 class="text-[41px] leading-[1.08] font-black text-tight text-white mb-3">
        Envoyez<br>
        <span class="text-zecolis-orange">moins cher.</span>
      </h1>

      <!-- One Single Supporting Sentence -->
      <p class="text-[14.5px] leading-snug font-normal text-slate-300 max-w-[310px] mb-6">
        Votre colis voyage avec quelqu’un qui part déjà.
      </p>

      <!-- Primary Action Button: "Suivant →" (56px height, rounded 16px, Navy #0B2A5B) -->
      <button class="w-full h-[56px] btn-gradient rounded-[16px] border border-white/15 text-white font-bold text-[16px] tracking-tight flex items-center justify-center space-x-2 transition-all duration-200 shadow-xl">
        <span>Suivant</span>
        <svg class="w-4 h-4 stroke-current stroke-[2.4] fill-none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <!-- Pagination Indicators (Step 1 Active: ● ○ ○) -->
      <div class="flex items-center justify-center space-x-2 mt-4 mb-1">
        <!-- 1st Active: Wide pill in signature orange -->
        <span class="w-6 h-1.5 bg-zecolis-orange rounded-full shadow-[0_0_8px_rgba(255,107,0,0.5)]"></span>
        <!-- 2nd Inactive -->
        <span class="w-1.5 h-1.5 bg-white/35 rounded-full"></span>
        <!-- 3rd Inactive -->
        <span class="w-1.5 h-1.5 bg-white/35 rounded-full"></span>
      </div>

      <!-- iOS Home Indicator bar -->
      <div class="w-32 h-1 bg-white/30 rounded-full mx-auto mt-2"></div>
    </div>

  </div>

</body>
</html>
